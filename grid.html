<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Grid Layout</title>
	<link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="grid-container">
	<header class="grid-header">Header</header>
	<nav class="grid-nav">Navigation</nav>
	<main class="grid-main">
		<h1>Основна частина сторінки</h1>
		<p>Це приклад контенту, розміщеного за допомогою CSS Grid.</p>
	</main>
	<aside class="grid-sidebar">Sidebar</aside>
	<section class="grid-gallery">
		<img src="images/photo1.jpg" alt="Фото 1">
		<img src="images/photo2.jpg" alt="Фото 2">
		<img src="images/photo3.jpg" alt="Фото 3">
		<img src="images/photo4.jpg" alt="Фото 4">
	</section>
	<footer class="grid-footer">Footer</footer>
</div>
</body>
</html>
